# LLM Configuration
openmanus.llm.provider=mock
openmanus.llm.default-model=mock-gpt-3.5
# openmanus.llm.api-key=YOUR_API_KEY_HERE # Externalize this!
# openmanus.llm.base-url=https://api.openai.com/v1
openmanus.llm.timeout-seconds=90

# Tool Configuration
openmanus.tools.code-execution.python-docker-image=python:3.11-slim
openmanus.tools.code-execution.default-timeout-seconds=120
openmanus.tools.browser.default-headless=true
openmanus.tools.browser.default-timeout-seconds=45

# Spring Datasource Properties
spring.datasource.url=jdbc:h2:mem:openmanusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # Creates/updates schema on startup. Use 'validate' or 'none' for prod with Flyway/Liquibase.
spring.jpa.show-sql=true # Show SQL logs, useful for development
spring.jpa.properties.hibernate.format_sql=true # Format SQL logs

# H2 Console (optional, for debugging the H2 database via browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false # Set to true if accessing from other machines (dev only)
