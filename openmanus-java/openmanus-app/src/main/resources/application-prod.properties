# PostgreSQL Datasource Configuration for PROD profile
spring.datasource.url=jdbc:postgresql://localhost:5432/openmanus_prod_db
spring.datasource.username=your_prod_username
spring.datasource.password=your_prod_password # Externalize this in a real production environment!
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Properties for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# For production, 'validate' or 'none' is recommended once schema is managed by Flyway/Liquibase.
# 'update' can be used for initial setup but is risky for existing data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false # Usually false for production
spring.jpa.properties.hibernate.format_sql=false

# Example: Configure Flyway (if you decide to use it)
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration # Location of your SQL migration scripts

# Logging level for production
logging.level.root=INFO
logging.level.io.github.myuser.openmanusjava=INFO

# Server port for production (if different)
# server.port=80

# Ensure LLM API keys and other sensitive data are configured via environment variables
# or a secure secrets management system for production.
# Example:
# openmanus.llm.apiKey=${OPENMANUS_LLM_API_KEY_PROD}
openmanus.llm.provider=openai # Assuming real LLM for prod
