# Test specific properties for LLM Integration
# To run real OpenAI tests, set environment variable OPENAI_API_KEY_INTEGRATION_TEST (e.g., to your actual key or any non-empty string)
# AND ensure openmanus.llm.apiKey is also set (e.g., via environment variable OPENAI_API_KEY)
# OR by uncommenting and setting it here (NOT RECOMMENDED for actual keys in committed files).

# Default to mock for safety if OPENAI_API_KEY_INTEGRATION_TEST is not actively used.
openmanus.llm.provider=mock
openmanus.llm.default-model=test-mock-gpt-for-integration-tests
# openmanus.llm.api-key=${OPENAI_API_KEY} # This would pick up from env var if set.
# openmanus.llm.base-url= # Optional, OpenAiService uses default
openmanus.llm.timeout-seconds=30 # Shorter timeout for tests

# If you want to enable real tests by default when API key is present via OPENAI_API_KEY env var:
# And you have OPENAI_API_KEY_INTEGRATION_TEST also set.
# Then you could set provider to openai here.
# Example for CI/CD or local setup where OPENAI_API_KEY is definitely set:
# openmanus.llm.provider=${LLM_PROVIDER_FOR_TESTS:mock} # Defaults to mock, can be overridden by env
# openmanus.llm.apiKey=${OPENAI_API_KEY} # Assumes OPENAI_API_KEY is set in the environment for real tests
# openmanus.llm.default-model=gpt-3.5-turbo # A common, relatively cheap model

logging.level.io.github.myuser.openmanusjava.llm=DEBUG
logging.level.com.theokanning.openai=INFO # To see less verbose logs from the client library during tests
